<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D Learning Pyramid</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#01030a}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";
import {OrbitControls} from "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js";

const R=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
R.setPixelRatio(Math.min(devicePixelRatio,2)); R.setSize(innerWidth,innerHeight);
R.outputColorSpace=THREE.SRGBColorSpace; R.toneMapping=THREE.ACESFilmicToneMapping;
document.body.appendChild(R.domElement);

const S=new THREE.Scene();
S.background=new THREE.Color(0x01030a);
S.fog=new THREE.FogExp2(0x01030a,.012);

const C=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,100);
C.position.set(0,4.3,13);
const O=new OrbitControls(C,R.domElement);
O.enableDamping=true; O.dampingFactor=.05; O.enablePan=false;
O.minDistance=8; O.maxDistance=20; O.target.set(0,2.7,0);

/* stars */
const N=1800, pos=new Float32Array(N*3);
for(let i=0;i<N;i++){
  const a=Math.random()*Math.PI*2, r=9+Math.random()*25;
  pos[i*3]=Math.cos(a)*r; pos[i*3+1]=(Math.random()-.3)*18;
  pos[i*3+2]=Math.sin(a)*r-7;
}
const sg=new THREE.BufferGeometry();
sg.setAttribute("position",new THREE.BufferAttribute(pos,3));
const sm=new THREE.PointsMaterial({color:0x328cff,size:.018,transparent:true,opacity:.6,depthWrite:false,blending:THREE.AdditiveBlending});
S.add(new THREE.Points(sg,sm));

/* orbital rings */
const rings=new THREE.Group(); rings.position.y=-.12; S.add(rings);
[4.9,4.25,3.55,2.85,5.35].forEach((r,i)=>{
  const m=new THREE.MeshBasicMaterial({
    color:i%2?0x159dff:0x684cff,transparent:true,opacity:.16+(i%3)*.07,
    blending:THREE.AdditiveBlending,depthWrite:false
  });
  const x=new THREE.Mesh(new THREE.TorusGeometry(r,.018,8,180),m);
  x.rotation.x=Math.PI/2; rings.add(x);
});

/* pyramid levels: exact five stacked frustums */
const defs=[
  ["Foundation",4.15,3.42,1.48,.74,0x315fff,"BASE"],
  ["Beginner",3.42,2.70,1.28,2.10,0x405fff,"LEVEL 01"],
  ["Intermediate",2.70,2.12,1.15,3.31,0x287cff,"LEVEL 02"],
  ["Advanced",2.12,1.52,1.05,4.41,0x287cff,"LEVEL 03"],
  ["Mastery",1.52,0,1.05,5.46,0x3975ff,"LEVEL 04"]
];
const P=new THREE.Group(); P.position.y=.12; S.add(P);

function crystal(d,index){
  const [name,bottom,top,h,y,col,sub]=d;
  const shape=new THREE.Shape();
  shape.moveTo(-bottom/2,-bottom/2); shape.lineTo(bottom/2,-bottom/2);
  shape.lineTo(bottom/2,bottom/2); shape.lineTo(-bottom/2,bottom/2); shape.closePath();
  const geo=new THREE.BufferGeometry();
  const v=[],ix=[];
  const rows=7,cols=12;
  const sides=[
    [[-bottom/2,-h/2,-bottom/2],[bottom/2,-h/2,-bottom/2],[-top/2,h/2,-top/2],[top/2,h/2,-top/2]],
    [[bottom/2,-h/2,-bottom/2],[bottom/2,-h/2,bottom/2],[top/2,h/2,-top/2],[top/2,h/2,top/2]],
    [[bottom/2,-h/2,bottom/2],[-bottom/2,-h/2,bottom/2],[top/2,h/2,top/2],[-top/2,h/2,top/2]],
    [[-bottom/2,-h/2,bottom/2],[-bottom/2,-h/2,-bottom/2],[-top/2,h/2,top/2],[-top/2,h/2,-top/2]]
  ];
  for(let s=0;s<4;s++){
    const [b0,b1,t0,t1]=sides[s],g=[];
    for(let r=0;r<=rows;r++){
      g[r]=[];
      for(let c=0;c<=cols;c++){
        const u=c/cols,w=r/rows;
        const A=new THREE.Vector3(...b0).lerp(new THREE.Vector3(...b1),u);
        const B=new THREE.Vector3(...t0).lerp(new THREE.Vector3(...t1),u);
        const q=A.lerp(B,w);
        const e=Math.sin(Math.PI*u)*Math.sin(Math.PI*w);
        q.x+=(Math.random()-.5)*.06*e; q.z+=(Math.random()-.5)*.06*e;
        g[r][c]=v.push(q.x,q.y,q.z)/3-1;
      }
    }
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
      const a=g[r][c],b=g[r][c+1],c1=g[r+1][c],d1=g[r+1][c+1];
      if((r+c+s)%2) ix.push(a,b,c1,b,d1,c1); else ix.push(a,b,d1,a,d1,c1);
    }
  }
  geo.setAttribute("position",new THREE.Float32BufferAttribute(v,3));
  geo.setIndex(ix); geo.computeVertexNormals();

  const mat=new THREE.MeshBasicMaterial({
    color:0x07163e,transparent:true,opacity:.72,side:THREE.DoubleSide
  });
  const mesh=new THREE.Mesh(geo,mat);

  const lines=new THREE.LineSegments(
    new THREE.EdgesGeometry(geo,1),
    new THREE.LineBasicMaterial({color:col,transparent:true,opacity:.82,blending:THREE.AdditiveBlending})
  );

  const g=new THREE.Group(); g.add(mesh,lines); g.position.y=y;
  g.userData={name,index};
  P.add(g);
  return g;
}
defs.forEach(crystal);

/* text labels */
function label(text,sub,scale){
  const c=document.createElement("canvas"); c.width=900;c.height=220;
  const x=c.getContext("2d"); x.textAlign="center";x.textBaseline="middle";
  x.font="600 58px Arial";x.fillStyle="#fff";x.shadowColor="#3d8cff";x.shadowBlur=16;
  x.fillText(text,450,92);x.shadowBlur=0;x.font="400 25px Arial";
  x.fillStyle="rgba(195,220,255,.7)";x.fillText(sub,450,154);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthTest:false,depthWrite:false}));
  s.scale.set(2.85*scale,.70*scale,1);return s;
}
defs.forEach((d,i)=>{
  const s=label(d[0],d[6],i===4?.82:.94);
  s.position.set(0,d[4],0);P.add(s);
});

/* subtle floating particles */
const pc=700,pp=new Float32Array(pc*3);
for(let i=0;i<pc;i++){
  const a=Math.random()*Math.PI*2,r=3.2+Math.random()*6;
  pp[i*3]=Math.cos(a)*r;pp[i*3+1]=Math.random()*7;pp[i*3+2]=Math.sin(a)*r;
}
const pg=new THREE.BufferGeometry();pg.setAttribute("position",new THREE.BufferAttribute(pp,3));
S.add(new THREE.Points(pg,new THREE.PointsMaterial({color:0x2d9bff,size:.015,transparent:true,opacity:.5,depthWrite:false,blending:THREE.AdditiveBlending})));

/* click a level */
const ray=new THREE.Raycaster(), mouse=new THREE.Vector2();
R.domElement.addEventListener("pointerdown",e=>{
  mouse.x=e.clientX/innerWidth*2-1; mouse.y=-(e.clientY/innerHeight)*2+1;
  ray.setFromCamera(mouse,C);
  const objects=[];
  P.children.forEach((g,i)=>g.traverse(o=>{if(o.isMesh){o.userData.level=i;objects.push(o)}}));
  const hit=ray.intersectObjects(objects)[0];
  if(hit){
    P.children.forEach((g,i)=>g.scale.setScalar(i===hit.object.userData.level?1.07:1));
  }
});

const clock=new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  const t=clock.getElapsedTime();
  rings.children.forEach((r,i)=>r.rotation.z+=((i%2)?.0015:-.0012));
  /* 4D-like temporal light motion: geometry stays 3D, its light field evolves */
  P.children.forEach((g,i)=>{
    g.traverse(o=>{
      if(o.isLineSegments)o.material.opacity=.62+.22*Math.sin(t*1.5+i*.7);
    });
  });
  O.update();R.render(S,C);
}
loop();

addEventListener("resize",()=>{
  C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();
  R.setSize(innerWidth,innerHeight);R.setPixelRatio(Math.min(devicePixelRatio,2));
});
</script>
</body>
</html>
